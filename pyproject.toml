[build-system]
requires = ["scikit-build-core>=0.4.3", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "pystl"
version = "0.1.2"
description = "Implementation of C++'s STL library into Python as a packaged module with the same high performance as native C++"
readme = "README.md"
requires-python = ">=3.8"